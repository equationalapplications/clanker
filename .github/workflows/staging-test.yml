name: Staging Test
on:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Every step below must be a *gate*: it reads the tree and fails, and never
# rewrites it. A step that writes (prettier --write, eslint --fix) always exits 0
# on anything it can auto-fix, so it reports success while proving nothing — and
# it shifts line numbers out from under every stack trace in the log. Use the
# `:check` variants here; use the writing variants locally.
jobs:
  run-staging-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v6

      # Must match the deployed runtime: `node:24-slim` in the cloud-agent
      # Dockerfile, `"runtime": "nodejs24"` in firebase.json, and
      # `engines.node: "24"` in functions/package.json.
      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Gate (read-only): `npm audit` queries npm's advisory service for the
      # installed lockfile tree. `--omit=dev` ignores tooling that never ships
      # in the app; `--audit-level=high` keeps moderate ReDoS-style noise from
      # blocking staging (tighten later if wanted). Verified passing 2026-08-26.
      - name: 🚨 Audit root dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: 🎨 Check formatting
        run: npm run format:check

      - name: 🔍 Lint
        run: npm run lint:check

      # Jest transforms TypeScript through Babel, which strips types without
      # checking them. Without these steps a type error reaches staging as long
      # as the tests pass.
      - name: 🧠 Typecheck root
        run: npm run typecheck

      - name: 🧪 Test with Jest
        run: npm run test

      - name: 📦 Install cloud-agent dependencies
        run: cd cloud-agent && npm ci

      # Same gate as root — cloud-agent ships its own deployed runtime, so a
      # vuln in its lockfile would ship if the root gate were the only check.
      - name: 🚨 Audit cloud-agent dependencies
        run: cd cloud-agent && npm audit --omit=dev --audit-level=high

      - name: 🧠 Typecheck cloud-agent
        run: cd cloud-agent && npm run typecheck

      # shared/ is compiled into cloud-agent but its tests are excluded from that
      # build (cloud-agent/tsconfig.json) and from root Jest
      # (jest.config.js testPathIgnorePatterns), so they run here via tsx.
      - name: 🧪 Test shared bridge (node:test)
        run: cd cloud-agent && node --import tsx/esm --test ../shared/constants.test.ts ../shared/dsl-schema.test.ts ../shared/hostPolicy.test.ts

      - name: 🧪 Test Cloud Agent
        run: cd cloud-agent && npm test

      - name: 📦 Install functions dependencies
        run: cd functions && npm ci

      # Same gate as root — functions is a deployed subproject with its own
      # lockfile (Cloud Functions runtime); vulns there would ship otherwise.
      - name: 🚨 Audit functions dependencies
        run: cd functions && npm audit --omit=dev --audit-level=high

      - name: 🔍 Lint functions
        run: cd functions && npm run lint

      - name: 🧠 Typecheck functions
        run: cd functions && npm run typecheck

      - name: 🧪 Test functions
        run: cd functions && npm test

      - name: 🧪 Test Desktop Bridge extension
        run: cd extension && npm ci && npm test

      # Same gate as root — the Chrome extension ships from its own lockfile;
      # a vuln there would publish via the Chrome Web Store pipeline.
      - name: 🚨 Audit extension dependencies
        run: cd extension && npm audit --omit=dev --audit-level=high

# Not run here, by design:
#   - src/services/__tests__/edgeAgentEvals.int.test.ts — live edge-agent evals.
#     Manual only, via `npm run edge-evals` (jest.evals.config.js). Costs money
#     per run and needs live credentials.
#   - cloud-agent/src/agent.live.test.ts — gated behind RUN_LIVE_TESTS=1 and
#     reported as skipped. Manual only, via `npm run test:live` in cloud-agent.
