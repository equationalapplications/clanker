name: Dependency release age

# Policy: a PR's package-lock.json delta vs the base branch must contain no
# registry version published in the last 14 days, to limit exposure to
# poisoned upstream releases — except packages under our own scope
# (@equationalapplications/*) resolved from the npm registry, which skip the
# cooldown but are still existence-checked (aliases placed under the scope
# remain age-checked). A PR whose delta is empty (no new or changed
# packages) passes without a cooldown; whole-lockfile sweeps stay available
# as manual `workflow_dispatch` audits. Runs before any install, so a
# too-new package's install scripts never execute in CI.
on:
  pull_request:
    paths:
      - package-lock.json
      - functions/package-lock.json
      - cloud-agent/package-lock.json
      - extension/package-lock.json
      - scripts/check-release-age.mjs
      - .github/workflows/dependency-release-age.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the base branch ref is present for the delta
          # diff; the checkout action's own fetch is authenticated during
          # the step, and `git show` afterwards needs no credentials.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
      - name: Check minimum release age
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          status=0
          base_args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_args=(--base "$BASE_REF")
          fi
          for lockfile in package-lock.json functions/package-lock.json cloud-agent/package-lock.json extension/package-lock.json; do
            node scripts/check-release-age.mjs --days 14 --lockfile "$lockfile" "${base_args[@]}" || status=1
          done
          exit "$status"
